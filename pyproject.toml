[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "memvara-examples"
version = "0.1.0"
description = "Two working AI agents that keep long-term memory in Memvara, and a CLI to start them."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
dependencies = [
    "memvara[cloud]>=0.13.0",
    "anthropic>=1.5",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
memvara-examples = "memvara_examples.cli:main"

[project.urls]
Homepage = "https://memvara.dev"
Repository = "https://github.com/memvara/memvara-examples"

[tool.hatch.build.targets.wheel]
packages = ["memvara_examples"]

[tool.pytest.ini_options]
testpaths = ["tests"]
